<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hkBgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066E0"/>
      <stop offset="50%" stop-color="#0057BB"/>
      <stop offset="100%" stop-color="#00357A"/>
    </linearGradient>
    <linearGradient id="hkGoldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hkOrangeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="hkShadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001838" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#hkBgGrad2)"/>

  <!-- Subtle Top Gloss Accent -->
  <path d="M0 115C0 51.487 51.487 0 115 0h282c63.513 0 115 51.487 115 115v40C400 130 112 130 0 155V115z" fill="#ffffff" opacity="0.08"/>

  <!-- Main Wallet Container with Shadow -->
  <g filter="url(#hkShadow2)">
    <!-- Wallet Outer Body (Crisp Bright White) -->
    <rect x="96" y="130" width="320" height="252" rx="36" fill="#FFFFFF"/>
    
    <!-- Top Flap Groove Line -->
    <rect x="96" y="198" width="320" height="14" fill="#E2E8F0"/>

    <!-- Wallet Clasp Base -->
    <rect x="306" y="210" width="120" height="92" rx="28" fill="#F1F5F9"/>
    <!-- Wallet Clasp Inner Tab (Royal Blue) -->
    <rect x="314" y="218" width="104" height="76" rx="20" fill="#0057BB"/>
    
    <!-- Gold Fastener Coin -->
    <circle cx="384" cy="256" r="18" fill="url(#hkGoldGrad2)"/>
    <circle cx="384" cy="256" r="9" fill="#FEF3C7" opacity="0.9"/>

    <!-- Rupee / Ledger Insignia on Left -->
    <g transform="translate(142, 220)">
      <!-- Top Bar 1 -->
      <rect x="0" y="0" width="70" height="11" rx="5.5" fill="#0057BB"/>
      <!-- Top Bar 2 -->
      <rect x="0" y="20" width="70" height="11" rx="5.5" fill="#0057BB"/>
      <!-- Vertical Stem -->
      <rect x="0" y="0" width="14" height="78" rx="7" fill="#0057BB"/>
      <!-- Upper Curve -->
      <path d="M0 0h40c14 0 24 10 24 22s-10 22-24 22H0" fill="none" stroke="#0057BB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Rupee Leg -->
      <path d="M22 42l34 40" stroke="#0057BB" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- Credit / Debit Dot Indicators -->
    <circle cx="270" cy="164" r="9" fill="#10B981"/>
    <circle cx="296" cy="164" r="9" fill="#EF4444"/>
  </g>

  <!-- PRO Badge Pill -->
  <g transform="translate(320, 396)">
    <rect width="124" height="46" rx="14" fill="url(#hkOrangeGrad2)"/>
    <text x="62" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-anchor="middle">PRO</text>
  </g>
</svg>
